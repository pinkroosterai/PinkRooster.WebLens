name: release-client

on:
  push:
    tags:
      - 'client-v*'
  pull_request:
    paths:
      - 'src/PinkRooster.WebLens.Client/**'
      - 'tests/PinkRooster.WebLens.Client.Tests/**'
      - 'tests/PinkRooster.WebLens.Architecture.Tests/**'
      - '.github/workflows/release-client.yml'

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    name: build and test client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build client library
        run: dotnet build src/PinkRooster.WebLens.Client/PinkRooster.WebLens.Client.csproj --configuration Release

      - name: Run client unit tests
        run: dotnet test --project tests/PinkRooster.WebLens.Client.Tests/PinkRooster.WebLens.Client.Tests.csproj --configuration Release

      - name: Run architecture tests
        run: dotnet test --project tests/PinkRooster.WebLens.Architecture.Tests/PinkRooster.WebLens.Architecture.Tests.csproj --configuration Release

  pack-and-publish:
    name: pack and publish package
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine package version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/client-v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#client-v}"
            echo "version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-preview.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack NuGet package and symbols
        run: >-
          dotnet pack src/PinkRooster.WebLens.Client/PinkRooster.WebLens.Client.csproj
          --configuration Release
          --output artifacts
          /p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Verify package size is under 500 KB
        shell: bash
        run: |
          NUPKG_FILE=$(ls artifacts/PinkRooster.WebLens.Client.*.nupkg | head -n 1)
          SIZE=$(stat -c%s "$NUPKG_FILE")
          echo "Package: $NUPKG_FILE ($SIZE bytes)"
          if [ "$SIZE" -ge 512000 ]; then
            echo "Error: Package exceeds 500 KB limit ($SIZE bytes)"
            exit 1
          fi

      - name: Authenticate with NuGet via OIDC
        if: startsWith(github.ref, 'refs/tags/client-v')
        uses: NuGet/login@v1

      - name: Push package to NuGet.org
        if: startsWith(github.ref, 'refs/tags/client-v')
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --skip-duplicate
